<!DOCTYPE html> 
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>誕生日カード一覧</title>

<meta name="description"
content="『ブレイクマイケース』の誕生日カード一覧ページです。テーマを絞り込んでの確認もできます。">

<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.png">

</head>

<body>

<h1>誕生日カード</h1>

<div class="panel">
<h3>表示設定</h3>

<div class="sort-area">

  <div class="sort-item">

    <label>並び替え</label>
    <select id="sortType">
     <option value="default">レアリティ</option>
     <option value="character">キャラクター</option>
     <option value="power">総合力</option>
    </select>

  </div>

  <div class="sort-item">
    <label for="sortOrder">順序</label>  

    <select id="sortOrder">
     <option value="asc">昇順</option>
     <option value="desc">降順</option>
    </select>

  </div>

  <div class="sort-item">
    <label for="themeFilter">テーマ</label>

    <select id="themeFilter">
      <option value="all">すべて</option>
      <option value="Present">Present</option>
      <option value="special day">special day</option>
      <option value="カラーコード">カラーコード</option>
    </select>
  </div>

</div>  

<div id="cardlist"></div>

<div class="button-row">

<button onclick="history.back()">← 戻る</button>

</div>

<script src="common.js"></script>
<script src="sort.js"></script>
<script src="cardUI.js"></script>
<script src="birthday.js"></script>

</body>
</html>
